name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  format-branch:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'agent/milestone-12-oakd-recorder'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone-12-oakd-recorder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install formatter
        run: python -m pip install ruff==0.5.7

      - name: Apply formatter
        shell: bash
        run: |
          ruff format src tests
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply OAK-D milestone formatting"
          git push origin HEAD:agent/milestone-12-oakd-recorder

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,visualization]"

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check src tests 2>&1 | tee ruff-output.txt

      - name: Check formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check src tests 2>&1 | tee format-output.txt

      - name: Type check
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy 2>&1 | tee mypy-output.txt

      - name: Test
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing 2>&1 | tee pytest-output.txt

      - name: Run tracking benchmark
        id: tracking_benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/benchmarks
          sightly benchmark-tracking --output reports/benchmarks/tracking.json \
            2>&1 | tee tracking-benchmark-output.txt

      - name: Upload tracking benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-benchmark
          path: reports/benchmarks/tracking.json
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ruff-output.txt
            format-output.txt
            mypy-output.txt
            pytest-output.txt
            tracking-benchmark-output.txt

      - name: Enforce check results
        if: >-
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.pytest.outcome == 'failure' ||
          steps.tracking_benchmark.outcome == 'failure'
        run: exit 1
