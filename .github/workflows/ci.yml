name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,visualization]"

      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check src tests 2>&1 | tee ruff-output.txt

      - name: Check formatting
        id: format
        continue-on-error: true
        run: ruff format --check src tests 2>&1 | tee format-output.txt

      - name: Type check
        id: mypy
        continue-on-error: true
        run: mypy 2>&1 | tee mypy-output.txt

      - name: Test
        id: pytest
        continue-on-error: true
        run: pytest --cov --cov-report=term-missing 2>&1 | tee pytest-output.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ruff-output.txt
            format-output.txt
            mypy-output.txt
            pytest-output.txt

      - name: Enforce check results
        if: >-
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.pytest.outcome == 'failure'
        run: exit 1
